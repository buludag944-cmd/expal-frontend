name: Blog weekly publish

# Every Monday morning (Irish time) this rebuilds the live site on Netlify.
# Articles in content/blog/ whose publishDate has arrived become visible
# with their cover image, a prerendered page and a sitemap entry.
# It also re-checks every article and opens a GitHub issue if a link broke,
# facts are due for review, or the queue of scheduled articles is running low.
#
# One-time setup (Bahar):
#   Netlify → expalapp → Site configuration → Build & deploy → Build hooks →
#   "Add build hook" (name: weekly-blog, branch: main) → copy the URL.
#   GitHub → expal-frontend → Settings → Secrets and variables → Actions →
#   New repository secret: NETLIFY_BUILD_HOOK = that URL.
on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC (07:30 Irish winter time, 08:30 summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check articles and links
        id: check
        continue-on-error: true
        run: node scripts/blog/check-sources.mjs --report blog-report.md

      - name: Trigger the Netlify rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. See the setup notes at the top of this workflow."
            exit 1
          fi
          # Articles with problems are skipped by the build, so the rest still go live.
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=Weekly+blog+publish"
          echo "Netlify rebuild triggered."

      - name: Report
        if: always()
        run: cat blog-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open an issue if something needs attention
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let report = "";
            try { report = fs.readFileSync("blog-report.md", "utf8"); } catch { return; }
            const needsFix = report.includes("## Must fix");
            const lowQueue = /Only \d+ article\(s\) scheduled/.test(report);
            const stale = report.includes("last reviewed");
            if (!needsFix && !lowQueue && !stale) return;
            const title = needsFix ? "Blog: an article needs fixing" : "Blog: action needed this week";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "blog",
            });
            const body = `${report}\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["blog"] });
            }
