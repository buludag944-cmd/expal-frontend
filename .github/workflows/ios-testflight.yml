name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          node scripts/verify-google-services-ios.js
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Build web app for Capacitor
        run: PUBLIC_URL=. npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Install code signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Create App Store provisioning profile
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install fastlane --no-document
          python3 <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump({
                  "key_id": os.environ["APPSTORE_KEY_ID"],
                  "issuer_id": os.environ["APPSTORE_ISSUER_ID"],
                  "key": os.environ["APPSTORE_PRIVATE_KEY"],
                  "duration": 1200,
                  "in_house": False,
              }, f)
          print(f"Wrote {path}")
          PY
          KEYCHAIN_SHA=$(security find-identity -v -p codesigning | awk '/Apple Distribution/ {print tolower($2); exit}')
          echo "Keychain distribution SHA-1: $KEYCHAIN_SHA"
          if [ -z "$KEYCHAIN_SHA" ]; then
            echo "No Apple Distribution identity found in the CI keychain."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PP_PATH="$RUNNER_TEMP/ExpalAppStore.mobileprovision"
          SELECTED_CERT=""
          for CERT_ID in SB54D2Z9VS S4N8727YZL Q7XF5XGRKR; do
            echo "Trying distribution certificate id: $CERT_ID"
            fastlane sigh \
              --app_identifier com.yourbrand.expal \
              --team_id "$APPLE_TEAM_ID" \
              --provisioning_name "EXPal App Store" \
              --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
              --cert_id "$CERT_ID" \
              --force \
              --skip_certificate_verification true \
              --skip_install true \
              --filename "$PP_PATH"
            PROFILE_SHA=$(python3 - "$PP_PATH" <<'PY'
          import hashlib, plistlib, subprocess, sys
          raw = subprocess.check_output(["security", "cms", "-D", "-i", sys.argv[1]])
          cert = plistlib.loads(raw)["DeveloperCertificates"][0]
          print(hashlib.sha1(cert).hexdigest())
          PY
            )
            echo "Profile cert SHA-1: $PROFILE_SHA"
            if [ "$PROFILE_SHA" = "$KEYCHAIN_SHA" ]; then
              SELECTED_CERT="$CERT_ID"
              break
            fi
          done
          if [ -z "$SELECTED_CERT" ]; then
            echo "Could not create a provisioning profile for the imported distribution certificate."
            exit 1
          fi
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "Installed provisioning profile EXPal App Store with cert $SELECTED_CERT ($UUID)"

      - name: Archive iOS app
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Expal.xcarchive" \
            archive

      - name: Export App Store IPA
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yourbrand.expal</key>
              <string>EXPal App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Expal.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
