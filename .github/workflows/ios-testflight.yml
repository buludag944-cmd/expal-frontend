name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # App Store Connect requires the iOS 26 SDK (Xcode 26+).
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26+ installed on runner:"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "Using $XCODE_APP"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          node scripts/verify-google-services-ios.js
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Build web app for Capacitor
        run: PUBLIC_URL=. npm run build
        env:
          # Must be production — phones cannot reach localhost. Do not omit.
          REACT_APP_API_URL: https://expalapp-1.onrender.com
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Install code signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Create App Store provisioning profile
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          gem install fastlane --no-document

          API_KEY_JSON="$RUNNER_TEMP/asc_api_key.json"
          python3 - "$API_KEY_JSON" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({
                  "key_id": os.environ["APPSTORE_KEY_ID"],
                  "issuer_id": os.environ["APPSTORE_ISSUER_ID"],
                  "key": os.environ["APPSTORE_PRIVATE_KEY"],
                  "duration": 1200,
                  "in_house": False,
              }, f)
          PY

          KEYCHAIN_SHA=$(security find-identity -v -p codesigning | awk '/Apple Distribution/ {print tolower($2); exit}')
          echo "Keychain distribution SHA-1: $KEYCHAIN_SHA"
          if [ -z "$KEYCHAIN_SHA" ]; then
            echo "No Apple Distribution identity found in the CI keychain."
            security find-identity -v -p codesigning || true
            exit 1
          fi

          # Intentionally bypass sigh file writing: we need SHA-1→cert matching and
          # stale-profile cleanup that sigh's --force/--cert_id loop does not do cleanly.
          # ASC API key must be able to manage certificates/profiles (Admin or Developer
          # access to Certificates, Identifiers & Profiles — App Manager alone is not enough).
          PP_PATH="$RUNNER_TEMP/ExpalAppStore.mobileprovision"
          META_JSON="$RUNNER_TEMP/profile_meta.json"
          ruby -e 'require "spaceship"' || {
            echo "Ruby cannot load spaceship after gem install. Gem env:"
            gem env
            exit 1
          }
          ruby - "$API_KEY_JSON" "$KEYCHAIN_SHA" "$PP_PATH" "$META_JSON" <<'RUBY'
          require "base64"
          require "json"
          require "openssl"
          require "spaceship"

          api_key_path, want_sha, out_path, meta_path = ARGV
          want_sha = want_sha.downcase
          bundle_id = "com.yourbrand.expal"
          desired_name = "EXPal App Store"
          profile_type = Spaceship::ConnectAPI::Profile::ProfileType::IOS_APP_STORE

          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.from(filepath: api_key_path)

          certs = Spaceship::ConnectAPI::Certificate.all(
            filter: {
              certificateType: [
                Spaceship::ConnectAPI::Certificate::CertificateType::DISTRIBUTION,
                Spaceship::ConnectAPI::Certificate::CertificateType::IOS_DISTRIBUTION
              ].join(",")
            }
          )
          match_cert = certs.find do |cert|
            raw = Base64.decode64(cert.certificate_content)
            OpenSSL::Digest::SHA1.hexdigest(raw) == want_sha
          end
          abort("No App Store Connect distribution certificate matches keychain SHA #{want_sha}") unless match_cert
          cert_id = match_cert.id
          puts "Matched distribution cert_id=#{cert_id} (#{match_cert.display_name})"

          bundle = Spaceship::ConnectAPI::BundleId.find(bundle_id)
          abort("Bundle id #{bundle_id} not found in App Store Connect") unless bundle

          fetch_profiles = lambda do
            Spaceship::ConnectAPI::Profile.all(
              filter: { profileType: profile_type },
              includes: "bundleId,certificates"
            ).select { |profile| profile.bundle_id&.identifier == bundle_id }
          end

          delete_profile = lambda do |profile, reason|
            puts "Deleting profile '#{profile.name}' (#{profile.id}) — #{reason}"
            begin
              profile.delete!
            rescue => e
              abort(
                "Failed to delete profile '#{profile.name}' (#{profile.id}): #{e.class}: #{e.message}. " \
                "ASC API key likely lacks Certificates/Profiles permission " \
                "(needs Admin or Developer access, not App Manager alone)."
              )
            end
          end

          profiles = fetch_profiles.call
          puts "Found #{profiles.size} App Store profile(s) for #{bundle_id}:"
          profiles.each do |profile|
            cert_ids = Array(profile.certificates).map(&:id)
            puts "  - '#{profile.name}' (#{profile.id}) certs=#{cert_ids.join(",")}"
          end

          # Drop profiles tied to rotated certs (and timestamped copies from past --force runs).
          stale = profiles.select do |profile|
            cert_ids = Array(profile.certificates).map(&:id)
            next false if cert_ids.include?(cert_id)
            profile.name == desired_name || profile.name.start_with?("#{desired_name} ")
          end
          if stale.empty?
            puts "No stale EXPal App Store profiles to delete."
          else
            stale.each do |profile|
              delete_profile.call(profile, "stale/rotated cert (not #{cert_id})")
            end
            remaining_stale = fetch_profiles.call.select do |profile|
              stale_ids = stale.map(&:id)
              stale_ids.include?(profile.id)
            end
            unless remaining_stale.empty?
              names = remaining_stale.map { |p| "'#{p.name}' (#{p.id})" }.join(", ")
              abort(
                "Stale profiles still present after delete: #{names}. " \
                "ASC API key likely cannot manage provisioning profiles " \
                "(needs Admin or Developer access)."
              )
            end
            puts "Verified #{stale.size} stale profile(s) deleted."
          end

          profiles = fetch_profiles.call
          matching = profiles.select do |candidate|
            Array(candidate.certificates).map(&:id).include?(cert_id)
          end

          profile = matching.find { |candidate| candidate.name == desired_name } || matching.first
          action = nil

          if profile && matching.size > 1
            matching.reject { |candidate| candidate.id == profile.id }.each do |dup|
              delete_profile.call(dup, "duplicate for cert #{cert_id}")
            end
          end

          if profile
            action = "reused"
            puts "Reusing existing profile '#{profile.name}' (#{profile.id}) for cert #{cert_id}"
          else
            taken = Spaceship::ConnectAPI::Profile.all(filter: { name: desired_name })
              .find { |candidate| candidate.name == desired_name }
            if taken
              delete_profile.call(taken, "name '#{desired_name}' occupied without matching cert")
            end
            puts "Creating App Store profile '#{desired_name}' with cert #{cert_id}"
            profile = Spaceship::ConnectAPI::Profile.create(
              name: desired_name,
              profile_type: profile_type,
              bundle_id_id: bundle.id,
              certificate_ids: [cert_id],
              device_ids: []
            )
            action = "created"
          end

          abort("Profile has no profileContent") if profile.profile_content.to_s.empty?
          File.binwrite(out_path, Base64.decode64(profile.profile_content))
          meta = {
            "action" => action,
            "cert_id" => cert_id,
            "uuid" => profile.uuid,
            "name" => profile.name,
            "path" => out_path
          }
          File.write(meta_path, JSON.pretty_generate(meta))
          puts "Wrote provisioning profile to #{out_path} (#{action})"
          puts JSON.pretty_generate(meta)
          RUBY

          test -f "$PP_PATH"
          PROFILE_UUID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$META_JSON")
          PROFILE_NAME=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$META_JSON")
          SELECTED_CERT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cert_id"])' "$META_JSON")
          PROFILE_ACTION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["action"])' "$META_JSON")

          # Confirm the on-disk profile matches the imported distribution identity.
          python3 - "$PP_PATH" "$KEYCHAIN_SHA" <<'PY'
          import hashlib, plistlib, subprocess, sys
          path, want = sys.argv[1], sys.argv[2].lower()
          raw = subprocess.check_output(["security", "cms", "-D", "-i", path])
          sha = hashlib.sha1(plistlib.loads(raw)["DeveloperCertificates"][0]).hexdigest()
          if sha != want:
              raise SystemExit(f"Profile cert SHA {sha} does not match keychain {want}")
          print(f"Verified profile cert SHA-1: {sha}")
          PY

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile '$PROFILE_NAME' with cert $SELECTED_CERT ($PROFILE_UUID) action=$PROFILE_ACTION"

      - name: Archive iOS app
        working-directory: ios/App
        run: |
          # Manual signing lives on the App target in project.pbxproj only.
          # Do not pass PROVISIONING_PROFILE_SPECIFIER / CODE_SIGN_* as global
          # xcodebuild overrides — they apply to every target, including SPM
          # packages (Firebase, GoogleUtilities, …) that cannot take a profile.
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("App.xcodeproj/project.pbxproj")
          text = path.read_text()
          name = os.environ["PROVISIONING_PROFILE_NAME"]
          new, n = re.subn(
              r'(PROVISIONING_PROFILE_SPECIFIER = )"[^"]*";',
              rf'\1"{name}";',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"Expected 1 PROVISIONING_PROFILE_SPECIFIER to update, found {n}")
          path.write_text(new)
          print(f"Set App target PROVISIONING_PROFILE_SPECIFIER to {name!r}")
          PY

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Expal.xcarchive" \
            archive

      - name: Export App Store IPA
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yourbrand.expal</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Expal.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"
          test -f "$RUNNER_TEMP/export/App.ipa"

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
