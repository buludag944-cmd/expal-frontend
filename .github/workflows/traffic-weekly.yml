name: Traffic weekly report

# Every Monday this saves last week's website traffic from Cloudflare Web Analytics
# to reports/traffic/latest.md (and a dated copy), so Claude's weekly task can read it.
#
# One-time setup (Bahar), GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  = Cloudflare custom token with "Account → Account Analytics → Read"
#   CLOUDFLARE_ACCOUNT_ID = the 32-character Cloudflare Account ID
on:
  schedule:
    - cron: "17 8 * * 1" # Mondays 08:17 UTC, after the blog publish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/analytics/cloudflare-weekly-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "expal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/traffic
          git diff --cached --quiet && exit 0
          git commit -m "Traffic report $(date -u +%F) [skip netlify]"
          git push
