[build]
  # Generates public/*.png from resources/expal_logo.png (needs committed resources/)
  command = "node scripts/ensure-logo.js && npm run build"
  publish = "build"

# Prefer static tracker assets over the SPA fallback when a file exists.
[[redirects]]
  from = "/tools/job-tracker/*"
  to = "/tools/job-tracker/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
